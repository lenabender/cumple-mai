<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Festejo Mi Cumple</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Invitación al cumple: una birra que se mueve con el celu tapa el póster del caballo hasta que te la tomás.">
<meta name="theme-color" content="#141a3c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&display=swap">
<style>
/* Layout: the designer's poster fills the screen and its hue drifts slowly round the wheel; the lettering is screened over it; a live pint covers everything and drinking it reveals the invitation. Controls sit in the top corners. */
:root {
  --night: #141a3c;
  --ink: #fffdf2;
  --glow: #ffe36a;
  --glow-soft: rgba(90, 170, 255, 0.65);
  --chip: rgba(16, 24, 64, 0.55);
  --edge: rgba(230, 240, 255, 0.75);
  --amber: #ffe36a;
  --sans: "Arimo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 700;
  font-size: 16px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#glass {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#fondo, #letras {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}
/* the poster's hue drifts all the way round, slowly and forever */
#fondo { animation: hue 48s linear infinite; will-change: filter; }
#letras { mix-blend-mode: screen; }
@keyframes hue {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}
#glass.draggable { cursor: grab; }
#glass.dragging { cursor: grabbing; }

.corner {
  position: fixed;
  z-index: 2;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
}
.corner.left { left: max(16px, env(safe-area-inset-left, 0px)); }
.corner.right { right: max(16px, env(safe-area-inset-right, 0px)); }
.btn {
  appearance: none;
  border: 0;
  font: inherit;
  cursor: pointer;
  color: var(--ink);
  background: var(--chip);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  width: 44px;
  height: 44px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 14px var(--glow-soft);
}
.btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
.btn svg { width: 22px; height: 22px; filter: drop-shadow(0 0 3px var(--glow)); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

.hint {
  position: fixed;
  z-index: 2;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  margin: 0;
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--chip);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  font-size: 17px;
  line-height: 1.25;
  text-align: center;
  text-wrap: balance;
  text-shadow: 0 0 4px var(--glow), 0 0 12px var(--glow);
  transition: opacity 0.6s ease;
  pointer-events: none;
}
.hint.faded { opacity: 0; }

.stage {
  position: fixed;
  z-index: 3;
  left: 0;
  right: 0;
  top: 52%;
  transform: translateY(-50%);
  display: grid;
  justify-items: center;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
  pointer-events: none;
}
.stage > * { pointer-events: auto; }
.glow-btn {
  appearance: none;
  cursor: pointer;
  font: inherit;
  font-size: 23px;
  line-height: 1.1;
  color: var(--ink);
  padding: 13px 28px 14px;
  border: 2px solid var(--edge);
  border-radius: 999px;
  background: var(--chip);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  text-shadow: 0 0 4px var(--glow), 0 0 12px var(--glow), 0 0 22px var(--glow);
  box-shadow: 0 0 22px var(--glow-soft), inset 0 0 14px rgba(90, 170, 255, 0.3);
}
.glow-btn:active { transform: scale(0.97); }
.title {
  margin: 0;
  max-width: 12ch;
  font-size: clamp(30px, 9vw, 46px);
  line-height: 1.05;
  text-wrap: balance;
  text-shadow: 0 0 6px var(--glow), 0 0 16px var(--glow), 0 0 30px var(--glow);
}
.sub {
  margin: 0;
  max-width: 28ch;
  font-size: 16px;
  line-height: 1.3;
  text-wrap: balance;
  text-shadow: 0 0 4px var(--glow), 0 0 12px var(--glow), 0 1px 2px rgba(0, 0, 0, 0.6);
}
@media (prefers-reduced-motion: reduce) {
  .hint { transition: none; }
  #fondo { animation: none; }
}
</style>

<canvas id="fondo" aria-hidden="true"></canvas>
<canvas id="letras" aria-hidden="true"></canvas>
<canvas id="glass" role="img" aria-label="31 de octubre, festejo mi cumple. Traé bebida. 14 de julio 972. Una birra que se mueve con el celular tapa la invitación hasta que te la tomás."></canvas>

<div class="corner left">
  <button id="sound" class="btn" type="button" aria-pressed="true" aria-label="Silenciar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"></path>
      <g id="soundOn"><path d="M15.5 9a4 4 0 0 1 0 6"></path><path d="M18 6.5a7.5 7.5 0 0 1 0 11"></path></g>
      <g id="soundOff" hidden><path d="M16 9.5l5 5M21 9.5l-5 5"></path></g>
    </svg>
  </button>
</div>
<div class="corner right">
  <button id="pour" class="btn" type="button" aria-label="Servir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 4h12l-1.6 16H7.6z"></path><path d="M6.6 9.5h10.8"></path>
    </svg>
  </button>
</div>

<p id="hint" class="hint faded" aria-live="polite">Inclinalo hacia tu boca para tomar</p>

<section id="start" class="stage" aria-label="Empezar">
  <p class="title">tomate una birra</p>
  <button id="go" class="glow-btn" type="button">OK</button>
</section>

<section id="salud" class="stage" aria-label="Vaso vacío" hidden>
  <p class="title">¡¡salute!!</p>
  <button id="again" class="glow-btn" type="button">servir otra</button>
</section>

<script>
(() => {
  'use strict';

  const cv = document.getElementById('glass');
  const ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const el = {
    hint: $('hint'), start: $('start'), go: $('go'),
    salud: $('salud'), again: $('again'),
    pour: $('pour'), sound: $('sound'), soundOn: $('soundOn'), soundOff: $('soundOff'),
  };
  const fondoCv = $('fondo'), letrasCv = $('letras');
  const fctx = fondoCv.getContext('2d', { alpha: false }), lctx = letrasCv.getContext('2d', { alpha: false });

  // the poster and the beer photo are both drawn on a 1080 x 2340 canvas
  const DW = 1080, DH = 2340;
  const TEXT_LEFT = 88, TEXT_RIGHT = 994; // the lettering must never be cropped
  const BEER_LINE = 737, BEER_FOAM_TOP = 528; // the photo's head, top to beer line
  const START_LINE = 0.15;           // a fresh glass fills up to 15% from the top of the screen
  const DRINK_OPACITY = 0.95;
  const PINT_ML = 500;
  const POUR_SECONDS = 2.6;
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const TAU = Math.PI * 2;

  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* private mode */ } }
  function rng(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const img = { fondo: new Image(), birra: new Image(), texto: new Image() };
  const files = { fondo: 'fondo.jpg', birra: 'birra.jpg', texto: 'texto.jpg' };
  let loaded = 0;
  for (const [name, im] of Object.entries(img)) {
    im.decoding = 'async';
    im.onload = () => { loaded += 1; if (loaded === 3) resize(); };
    im.src = files[name];
  }
  const ready = () => loaded === 3;

  // ---- glass geometry: the screen is the front of a box W x H x DZ ----
  let W = 1, H = 1, DPR = 1, DZ = 1, R = 1, dprCap = 2;
  let s = 1, offX = 0, offY = 0;
  let drinkSheet = null, foamSprite = null, foamGeo = null, drinkCv = null, dctx = null;
  let full = 0.62;

  // ---- beer state ----
  let fill = 0.62, foam = 0, foamRest = 1, foamMax = 1;
  let pouring = false, stream = 0, fizz = 0;
  let started = false, emptyShown = false, seeded = false;
  let drinkRate = 0, gulpTimer = 0, drunkMl = 0;
  let time = 0;

  // ---- gravity: target from the phone or the finger; the beer chases it on a spring ----
  const gT = { x: 0, y: 1, z: 0 }, gE = { x: 0, y: 1, z: 0 }, gV = { x: 0, y: 0, z: 0 };
  let gx = 0, gy = 1, gz = 0;
  let nX = 0, nY = 1, m = 1;
  let level = 0, sLine = 0, yS = 0, foamT = 0;
  let prevAng = 0;

  let mode = 'idle', sensorSeen = false, motionSeen = false;
  const tilt = { roll: 0, pitch: 0 };
  let drag = null;
  const keys = new Set();
  const acc = { x: 0, y: 0 };
  let shakes = [];

  // ---- surface waves along the beer line ----
  const WN = 72;
  const wh = new Float32Array(WN), wv = new Float32Array(WN);
  const sx = new Float32Array(WN), sy = new Float32Array(WN);
  const nodeX = (i) => -R + (2 * R * i) / (WN - 1);
  function waveAt(lx) {
    const f = clamp(((lx + R) / (2 * R)) * (WN - 1), 0, WN - 1.001);
    const i = f | 0, t = f - i;
    return wh[i] * (1 - t) + wh[i + 1] * t;
  }
  function kick(lx, amount, width) {
    for (let i = 0; i < WN; i++) {
      const d = (nodeX(i) - lx) / width;
      wv[i] += amount * Math.exp(-d * d);
    }
  }
  function stepWaves(dt) {
    const n = 3, h = dt / n, dx = (2 * R) / (WN - 1), c2 = (260 * 260) / (dx * dx);
    for (let k = 0; k < n; k++) {
      for (let i = 0; i < WN; i++) {
        const l = wh[i > 0 ? i - 1 : 1], r = wh[i < WN - 1 ? i + 1 : WN - 2];
        wv[i] += (c2 * (l + r - 2 * wh[i]) - 38 * wh[i] - 1.7 * wv[i]) * h;
      }
      let mean = 0;
      for (let i = 0; i < WN; i++) { wh[i] = clamp(wh[i] + wv[i] * h, -36, 36); mean += wh[i]; }
      mean /= WN;
      for (let i = 0; i < WN; i++) wh[i] -= mean;
    }
  }

  // ---- volume: how high the beer stands for a given tilt ----
  const CX = [0, 1, 1, 0], CY = [0, 0, 1, 1];
  const PX = new Float64Array(8), PY = new Float64Array(8);
  function sliceArea(ax, ay, t) {
    let n = 0;
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) & 3;
      const xi = CX[i] * W, yi = CY[i] * H, xj = CX[j] * W, yj = CY[j] * H;
      const fi = ax * xi + ay * yi - t, fj = ax * xj + ay * yj - t;
      if (fi >= 0) { PX[n] = xi; PY[n] = yi; n++; }
      if ((fi >= 0) !== (fj >= 0)) {
        const k = fi / (fi - fj);
        PX[n] = xi + (xj - xi) * k; PY[n] = yi + (yj - yi) * k; n++;
      }
    }
    if (n < 3) return 0;
    let a = 0;
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; a += PX[i] * PY[j] - PX[j] * PY[i]; }
    return Math.abs(a) * 0.5;
  }
  const SLICES = 24;
  function volumeAbove(lv) {
    const dz = DZ / SLICES;
    let v = 0;
    for (let k = 0; k < SLICES; k++) v += sliceArea(gx, gy, lv - gz * (k + 0.5) * dz);
    return v * dz;
  }
  function solveLevel(frac) {
    const a = gx * W, b = gy * H, c = gz * DZ;
    let lo = Math.min(0, a) + Math.min(0, b) + Math.min(0, c);
    let hi = Math.max(0, a) + Math.max(0, b) + Math.max(0, c);
    if (frac <= 0) return hi + 1;
    const target = frac * W * H * DZ;
    for (let it = 0; it < 26; it++) {
      const mid = (lo + hi) * 0.5;
      if (volumeAbove(mid) > target) lo = mid; else hi = mid;
    }
    return (lo + hi) * 0.5;
  }
  const inBeer = (x, y, margin) => nX * x + nY * y >= sLine + margin;

  // ---- the designer's layers, fitted to this screen ----
  function makeLayer() {
    const c = document.createElement('canvas');
    c.width = cv.width; c.height = cv.height;
    const x = c.getContext('2d');
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    return [c, x];
  }
  // the poster and its lettering each get their own canvas, so the hue can drift on the poster alone
  function paintPoster() {
    for (const [canvas, x, im, soft] of [[fondoCv, fctx, img.fondo, true], [letrasCv, lctx, img.texto, false]]) {
      canvas.width = cv.width; canvas.height = cv.height;
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
      x.fillStyle = '#000';
      x.fillRect(0, 0, W, H);
      if (soft && (offX > 0.5 || offY > 0.5)) {
        // fill the margins with a soft, stretched copy of the poster
        const cs = Math.max(W / DW, H / DH);
        try { x.filter = 'blur(18px)'; } catch (e) { /* plain stretch */ }
        x.drawImage(im, (W - DW * cs) / 2, (H - DH * cs) / 2, DW * cs, DH * cs);
        try { x.filter = 'none'; } catch (e) { /* ignore */ }
      }
      x.drawImage(im, offX, offY, DW * s, DH * s);
    }
  }
  // the beer photo shares the poster's canvas, so it lines up with it on any phone
  function paintBeer(im) {
    const [c, x] = makeLayer();
    if (offX > 0.5 || offY > 0.5) {
      const cs = Math.max(W / DW, H / DH);
      x.drawImage(im, (W - DW * cs) / 2, (H - DH * cs) / 2, DW * cs, DH * cs);
    }
    x.drawImage(im, offX, offY, DW * s, DH * s);
    return c;
  }
  // the head: a wavy band painted once, with the photo's own colours from its top (t = 0) to the beer line (t = 1)
  const FOAM_STOPS = [
    [-0.12, 'rgba(248,241,216,0)'], [-0.02, 'rgba(248,241,216,0.6)'], [0.06, 'rgba(246,239,214,0.95)'],
    [0.17, 'rgb(249,241,216)'], [0.29, 'rgb(247,238,208)'], [0.46, 'rgb(244,233,196)'],
    [0.57, 'rgb(241,224,175)'], [0.69, 'rgb(233,206,123)'], [0.8, 'rgb(221,180,64)'],
    [0.86, 'rgb(214,161,41)'], [0.93, 'rgb(203,119,32)'], [0.97, 'rgb(209,141,31)'], [1.02, 'rgb(221,167,28)'],
  ];
  const FOAM_BUBBLES = [
    { t0: 0.08, t1: 0.6, density: 0.03, r0: 0.5, r1: 1.5, fill: 'rgba(255,255,250,0.4)', rim: 'rgba(196,174,128,0.16)' },
    { t0: 0.5, t1: 0.88, density: 0.012, r0: 1, r1: 3.4, fill: 'rgba(255,226,140,0.35)', rim: 'rgba(186,116,36,0.42)' },
    { t0: 0.86, t1: 0.99, density: 0.03, r0: 0.9, r1: 2.4, fill: 'rgba(244,150,40,0.4)', rim: 'rgba(150,58,12,0.5)' },
  ];
  function paintFoamSprite() {
    const F = foamRest, y0 = F * 0.22, yL = y0 + F, Hs = yL + F * 0.14, Ws = 2 * R + 8;
    const c = document.createElement('canvas');
    c.width = Math.ceil(Ws * DPR); c.height = Math.ceil(Hs * DPR);
    const x = c.getContext('2d');
    x.scale(DPR, DPR);
    const r = rng(9), p1 = r() * TAU, p2 = r() * TAU, p3 = r() * TAU, A = F * 0.09;
    const topAt = (u) => y0 + A * (0.55 * Math.sin(u / 41 + p1) + 0.3 * Math.sin(u / 17 + p2) + 0.15 * Math.sin(u / 7.3 + p3));
    const band = new Path2D(), crest = new Path2D();
    band.moveTo(0, Hs);
    crest.moveTo(0, topAt(0));
    for (let u = 0; u <= Ws; u += 3) { band.lineTo(u, topAt(u)); crest.lineTo(u, topAt(u)); }
    band.lineTo(Ws, Hs);
    band.closePath();
    const g = x.createLinearGradient(0, 0, 0, Hs);
    for (const [t, col] of FOAM_STOPS) g.addColorStop(clamp((y0 + t * F) / Hs, 0, 1), col);
    g.addColorStop(1, 'rgb(218,158,26)');
    // the band glows a little past its own outline, so the top edge reads soft
    x.save();
    x.shadowColor = 'rgba(252,242,215,0.95)';
    x.shadowBlur = 7 * DPR;
    x.fillStyle = g;
    x.fill(band);
    x.restore();
    // bubbles: fine and white up top, golden lower down, a rusty seam where it meets the beer
    x.save();
    x.clip(band);
    for (const z of FOAM_BUBBLES) {
      const n = Math.round(Ws * (z.t1 - z.t0) * F * z.density);
      const body = new Path2D(), shine = new Path2D();
      for (let i = 0; i < n; i++) {
        const u = r() * Ws, y = y0 + (z.t0 + (z.t1 - z.t0) * r()) * F, rad = z.r0 + (z.r1 - z.r0) * r() * r();
        body.moveTo(u + rad, y); body.arc(u, y, rad, 0, TAU);
        const hx = u - rad * 0.35, hy = y - rad * 0.4, hr = rad * 0.3;
        shine.moveTo(hx + hr, hy); shine.arc(hx, hy, hr, 0, TAU);
      }
      x.fillStyle = z.fill; x.fill(body);
      x.lineWidth = 0.7; x.strokeStyle = z.rim; x.stroke(body);
      x.fillStyle = 'rgba(255,255,255,0.7)'; x.fill(shine);
    }
    x.restore();
    // a bright, soft crest
    x.save();
    x.shadowColor = 'rgba(255,252,240,0.9)';
    x.shadowBlur = 6 * DPR;
    x.strokeStyle = 'rgba(255,253,246,0.7)';
    x.lineWidth = 2.5;
    x.lineJoin = 'round';
    x.stroke(crest);
    x.restore();
    // let the lip of beer under the head fade into the body
    x.save();
    x.globalCompositeOperation = 'destination-out';
    const fade = x.createLinearGradient(0, yL + F * 0.02, 0, Hs - 2);
    fade.addColorStop(0, 'rgba(0,0,0,0)');
    fade.addColorStop(1, 'rgba(0,0,0,1)');
    x.fillStyle = fade;
    x.fillRect(0, yL, Ws, Hs - yL + 4);
    x.restore();
    foamGeo = { yL, Hs, Ws };
    return c;
  }

  function resize() {
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    DPR = Math.min(dprCap, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    DZ = Math.min(W, H) * 0.2;
    R = Math.hypot(W, H) / 2 + 2;
    s = Math.min(H / DH, (W / 2 - 8) / (DW / 2 - TEXT_LEFT), (W / 2 - 8) / (TEXT_RIGHT - DW / 2));
    offX = (W - DW * s) / 2;
    offY = (H - DH * s) / 2;
    full = 1 - START_LINE;
    foamRest = (BEER_LINE - BEER_FOAM_TOP) * s;
    foamMax = foamRest * 1.35;
    if (!seeded) { fill = full; foam = foamRest; seeded = true; }
    drinkCv = document.createElement('canvas');
    drinkCv.width = cv.width; drinkCv.height = cv.height;
    dctx = drinkCv.getContext('2d');
    foamSprite = paintFoamSprite();
    if (ready()) {
      paintPoster();
      drinkSheet = paintBeer(img.birra);
    }
    seedMotes();
  }

  // ---- sensors ----
  function screenTurn() {
    const o = screen.orientation;
    const a = o && typeof o.angle === 'number' ? o.angle : (typeof window.orientation === 'number' ? window.orientation : 0);
    return (a * Math.PI) / 180;
  }
  function toScreen(x, y) {
    const t = screenTurn(), c = Math.cos(t), si = Math.sin(t);
    return [x * c + y * si, -x * si + y * c];
  }
  function onOrientation(e) {
    if (e.beta == null || e.gamma == null) return;
    const b = (e.beta * Math.PI) / 180, g = (e.gamma * Math.PI) / 180;
    const v = toScreen(Math.cos(b) * Math.sin(g), Math.sin(b));

  let ac = null, master = null, noiseBuf = null, pourGain = null, fizzGain = null, audioClock = 0;

  // ---- drawing ----
  function setLocal(c) {

    if (!reduceMotion) drawMotes();
    // the pint is painted on its own layer, then laid over everything, lettering included, at 95%
    const c = dctx;
    c.setTransform(1, 0, 0, 1, 0, 0);

    if (fill > 0.0005 && yS < R) {

      if (headed) {

        beer.moveTo(sx[0], sy[0]);
        curve(beer, sx, sy, 0, WN - 1);
      }
      beer.lineTo(R + 4, R + 4);
      beer.lineTo(-R - 4, R + 4);
      beer.closePath();
      c.save();
      setLocal(c);
      c.clip(beer);
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(drinkSheet, 0, 0);
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      drawBubbles(c);
      c.restore();
      if (headed) drawFoam(c, k, lift, slope);
      streamEnd = yS - foamT;
    }
    drawStream(c, streamEnd);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = DRINK_OPACITY;
    ctx.drawImage(drinkCv, 0, 0);
    ctx.globalAlpha = 1;
  }

  function updateControls() {
    const pourable = !pouring && fill < full * 0.98;
    if (el.pour.disabled === pourable) el.pour.disabled = !pourable;
  }

  // ---- loop, with a lighter canvas if the phone struggles ----
  let last = performance.now(), slow = 0;
  function frame(now) {
    const raw = (now - last) / 1000;
    last = now;
    const dt = Math.min(0.05, Math.max(0, raw));
    if (raw < 0.25) {
      // only a phone that can't keep 22 fps for several seconds gets a softer canvas; 30 fps battery saving is fine
      slow = raw > 1 / 22 ? slow + raw : Math.max(0, slow - raw * 0.5);
      if (slow > 3 && dprCap > 1.5 && (window.devicePixelRatio || 1) > 1.5) { dprCap = 1.5; slow = 0; resize(); }
    }
    update(dt);
    draw();
    updateControls();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  resize();
  paintSoundButton();
  for (let i = 0; i < 60; i++) update(1 / 60);
  draw();
  updateControls();
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
